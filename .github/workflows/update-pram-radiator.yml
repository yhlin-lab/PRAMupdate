name: Update PRAM Radiator from Jira

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 7:00 AM UTC
  workflow_dispatch:      # Also allows manual trigger from GitHub Actions tab

jobs:
  update-radiator:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Jira epics and update Gist
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          GITHUB_TOKEN_GIST: ${{ secrets.GIST_TOKEN }}
          GIST_ID: b75c659d38518125dd0d777ed8a482d7
          GIST_FILE: pram-data.json
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.error
          import json
          import base64
          import os

          JIRA_BASE = "https://bonhams.atlassian.net"
          JIRA_EMAIL = os.environ["JIRA_EMAIL"]
          JIRA_TOKEN = os.environ["JIRA_TOKEN"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN_GIST"]
          GIST_ID = os.environ["GIST_ID"]
          GIST_FILE = os.environ["GIST_FILE"]

          auth = base64.b64encode(f"{JIRA_EMAIL}:{JIRA_TOKEN}".encode()).decode()
          jira_headers = {
              "Authorization": f"Basic {auth}",
              "Accept": "application/json"
          }

          # Epic IDs per component (can list multiple, progress is averaged)
          EPICS = {
              "c1": ["NDC-8214"],        # Clerk Console
              "c2": ["NDC-8218"],        # Registration Engine: Live Auctions
              "c3": ["NDC-8213"],        # Auctioneer Console
              "c4": ["NDC-8216"],        # Auction Room Display
              "c5": ["NDC-8215", "NDC-8548"],  # Live Bidding Page (Web + App)
              "c6": ["NDC-8219"],        # Auction & Lot Details
          }

          def get_epic_progress(epic_key):
              """Fetch all child issues of an epic and calculate % story points done."""
              jql = f'issueFunction in issuesinEpics("key = {epic_key}") AND issuetype != Epic'
              url = (f"{JIRA_BASE}/rest/api/3/search"
                     f"?jql={urllib.request.quote(jql)}"
                     f"&fields=status,story_points,customfield_10016"
                     f"&maxResults=200")
              try:
                  req = urllib.request.Request(url, headers=jira_headers)
                  with urllib.request.urlopen(req) as r:
                      data = json.loads(r.read())
                  issues = data.get("issues", [])
                  total_sp = 0
                  done_sp = 0
                  for issue in issues:
                      fields = issue.get("fields", {})
                      # story points: customfield_10016 or customfield_10028
                      sp = fields.get("customfield_10016") or fields.get("customfield_10028") or 0
                      if sp:
                          sp = float(sp)
                          total_sp += sp
                          status_cat = fields.get("status", {}).get("statusCategory", {}).get("key", "")
                          if status_cat == "done":
                              done_sp += sp
                  if total_sp == 0:
                      return None  # No story points set — don't override
                  return round((done_sp / total_sp) * 100)
              except Exception as e:
                  print(f"  Warning: could not fetch {epic_key}: {e}")
                  return None

          def get_component_progress(epic_keys):
              """Average progress across multiple epics."""
              results = [get_epic_progress(k) for k in epic_keys]
              valid = [r for r in results if r is not None]
              if not valid:
                  return None
              return round(sum(valid) / len(valid))

          # Fetch current Gist data
          print("Fetching current Gist data...")
          gist_url = f"https://api.github.com/gists/{GIST_ID}"
          gh_headers = {
              "Authorization": f"token {GITHUB_TOKEN}",
              "Accept": "application/vnd.github.v3+json"
          }
          req = urllib.request.Request(gist_url, headers=gh_headers)
          with urllib.request.urlopen(req) as r:
              gist_data = json.loads(r.read())

          content = gist_data["files"][GIST_FILE]["content"]
          radiator = json.loads(content)

          # Update each component's progress
          print("Fetching Jira epic progress...")
          updated = False
          for comp in radiator.get("components", []):
              comp_id = comp.get("id")
              if comp_id in EPICS:
                  epic_keys = EPICS[comp_id]
                  print(f"  {comp['name']} ({', '.join(epic_keys)})...")
                  pct = get_component_progress(epic_keys)
                  if pct is not None:
                      old = comp.get("progress", 0)
                      comp["progress"] = pct
                      print(f"    {old}% → {pct}%")
                      updated = True
                  else:
                      print(f"    No story points found — keeping {comp.get('progress', 0)}%")

                  # Also update sub-rows proportionally if they exist
                  sub_rows = comp.get("subRows", [])
                  if sub_rows and pct is not None and len(EPICS[comp_id]) > 1:
                      per_epic = []
                      for key in EPICS[comp_id]:
                          p = get_epic_progress(key)
                          per_epic.append(p if p is not None else 0)
                      for i, sub in enumerate(sub_rows):
                          if i < len(per_epic):
                              sub["progress"] = per_epic[i]

          if not updated:
              print("No updates to apply.")
          else:
              # Write updated data back to Gist
              print("Saving updated data to Gist...")
              new_content = json.dumps(radiator, indent=2)
              payload = json.dumps({"files": {GIST_FILE: {"content": new_content}}}).encode()
              req = urllib.request.Request(
                  gist_url,
                  data=payload,
                  headers={**gh_headers, "Content-Type": "application/json"},
                  method="PATCH"
              )
              with urllib.request.urlopen(req) as r:
                  print(f"  Gist updated. Status: {r.status}")

          print("Done.")
          PYEOF
