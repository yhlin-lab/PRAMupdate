name: Update PRAM Radiator from Jira

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  update-radiator:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Jira epics and update Gist
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          GITHUB_TOKEN_GIST: ${{ secrets.GIST_TOKEN }}
          GIST_ID: b75c659d38518125dd0d777ed8a482d7
          GIST_FILE: pram-data.json
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import urllib.error
          import json
          import base64
          import os

          JIRA_BASE = "https://bonhams.atlassian.net"
          JIRA_EMAIL = os.environ["JIRA_EMAIL"]
          JIRA_TOKEN = os.environ["JIRA_TOKEN"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN_GIST"]
          GIST_ID = os.environ["GIST_ID"]
          GIST_FILE = os.environ["GIST_FILE"]

          auth = base64.b64encode(f"{JIRA_EMAIL}:{JIRA_TOKEN}".encode()).decode()
          jira_headers = {
              "Authorization": f"Basic {auth}",
              "Accept": "application/json"
          }

          SP_FIELD = "customfield_10452"  # confirmed from Step 1 log

          EPICS = {
              "c1": ["NDC-8214"],
              "c2": ["NDC-8218"],
              "c3": ["NDC-8213"],
              "c4": ["NDC-8216"],
              "c5": ["NDC-8215", "NDC-8548"],
              "c6": ["NDC-8219"],
          }

          def jira_get(url):
              req = urllib.request.Request(url, headers=jira_headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def get_epic_progress(epic_key):
              """Try multiple JQL approaches for current Jira Cloud."""
              jqls = [
                  f'parent = {epic_key}',
                  f'"parent" = {epic_key}',
                  f'issue in childIssuesOf("{epic_key}")',
                  f'project = NDC AND "Epic Link" = {epic_key}',
              ]
              for jql in jqls:
                  try:
                      url = (f"{JIRA_BASE}/rest/api/3/search"
                             f"?jql={urllib.request.quote(jql)}"
                             f"&fields=status,{SP_FIELD}"
                             f"&maxResults=200")
                      data = jira_get(url)
                      issues = data.get("issues", [])
                      if not issues:
                          print(f"    JQL returned 0 issues: {jql[:50]}")
                          continue
                      print(f"    Found {len(issues)} issues via: {jql[:50]}")
                      total_sp = 0
                      done_sp = 0
                      for issue in issues:
                          fields = issue.get("fields", {})
                          sp = fields.get(SP_FIELD) or 0
                          if sp:
                              sp = float(sp)
                              total_sp += sp
                              status_cat = (fields.get("status", {})
                                            .get("statusCategory", {})
                                            .get("key", ""))
                              if status_cat == "done":
                                  done_sp += sp
                      print(f"    Story points: {done_sp} done / {total_sp} total")
                      if total_sp == 0:
                          # Try counting issues by status instead
                          print(f"    No story points — falling back to issue count")
                          total = len(issues)
                          done = sum(1 for i in issues
                                     if i.get("fields",{}).get("status",{})
                                     .get("statusCategory",{}).get("key","") == "done")
                          print(f"    Issues: {done} done / {total} total")
                          if total == 0:
                              return None
                          return round((done / total) * 100)
                      return round((done_sp / total_sp) * 100)
                  except urllib.error.HTTPError as e:
                      print(f"    HTTP {e.code} for JQL: {jql[:50]}")
                      continue
                  except Exception as e:
                      print(f"    Error for JQL ({jql[:40]}): {e}")
                      continue

              # Last resort: fetch the epic itself and check its progress field
              try:
                  print(f"    Trying direct epic fetch for {epic_key}...")
                  data = jira_get(f"{JIRA_BASE}/rest/api/3/issue/{epic_key}?fields=status,progress,aggregateprogress,{SP_FIELD}")
                  fields = data.get("fields", {})
                  prog = fields.get("aggregateprogress") or fields.get("progress", {})
                  total = prog.get("total", 0)
                  done = prog.get("progress", 0)
                  print(f"    Aggregate progress: {done}/{total}")
                  if total > 0:
                      return round((done / total) * 100)
              except Exception as e:
                  print(f"    Direct epic fetch failed: {e}")

              return None

          def get_component_progress(epic_keys):
              results = [get_epic_progress(k) for k in epic_keys]
              valid = [r for r in results if r is not None]
              if not valid:
                  return None
              return round(sum(valid) / len(valid))

          # Fetch current Gist
          print("Fetching Gist data...")
          gist_url = f"https://api.github.com/gists/{GIST_ID}"
          gh_headers = {
              "Authorization": f"token {GITHUB_TOKEN}",
              "Accept": "application/vnd.github.v3+json"
          }
          req = urllib.request.Request(gist_url, headers=gh_headers)
          with urllib.request.urlopen(req) as r:
              gist_data = json.loads(r.read())
          content = gist_data["files"][GIST_FILE]["content"]
          radiator = json.loads(content)

          print("Fetching Jira progress...\n")
          updated = False
          for comp in radiator.get("components", []):
              comp_id = comp.get("id")
              if comp_id not in EPICS:
                  continue
              epic_keys = EPICS[comp_id]
              print(f"{comp['name']} ({', '.join(epic_keys)}):")
              pct = get_component_progress(epic_keys)
              if pct is not None:
                  old = comp.get("progress", 0)
                  comp["progress"] = pct
                  print(f"  → {old}% → {pct}%\n")
                  updated = True
              else:
                  print(f"  → No update (keeping {comp.get('progress',0)}%)\n")

              # Sub-rows per epic
              sub_rows = comp.get("subRows", [])
              if sub_rows and len(EPICS[comp_id]) > 1:
                  for i, sub in enumerate(sub_rows):
                      if i < len(EPICS[comp_id]):
                          p = get_epic_progress(EPICS[comp_id][i])
                          if p is not None:
                              sub["progress"] = p

          if not updated:
              print("No updates — Gist unchanged.")
          else:
              print("Saving to Gist...")
              new_content = json.dumps(radiator, indent=2)
              payload = json.dumps({"files":{GIST_FILE:{"content":new_content}}}).encode()
              req = urllib.request.Request(
                  gist_url, data=payload,
                  headers={**gh_headers,"Content-Type":"application/json"},
                  method="PATCH"
              )
              with urllib.request.urlopen(req) as r:
                  print(f"Done. Status: {r.status}")

          print("Workflow complete.")
          PYEOF
